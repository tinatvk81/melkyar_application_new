services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: melkyar
      POSTGRES_USER: melkyar_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melkyar_app -d melkyar"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: melkyar
      POSTGRES_USER: melkyar_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      APP_VERSION: "1.0.0"
      INSTALLER_FILENAME: "RealEstateApp-Setup-1.0.0.exe"
    ports:
      - "8000:8000"
    volumes:
      - ./server/media:/app/media
      - ./server/logs:/app/logs
      - ./server/static_installers:/app/static_installers
      - ./server/contract_template.txt:/app/contract_template.txt:ro

volumes:
  db_data: